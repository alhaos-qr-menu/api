name: Build and Deploy API

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: Build API binary
        run: |
          go mod download
          go vet ./...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o api ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-binary
          path: api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-binary

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload binary to server
        run: |
          chmod +x api
          scp api ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/api.new

      - name: Move binary into place and restart service
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            sudo /usr/bin/mv /home/${{ secrets.DEPLOY_USER }}/api.new /opt/qr-menu/api/api
            sudo /usr/bin/chown qr-menu-api:qr-menu-api /opt/qr-menu/api/api
            sudo /usr/bin/chmod +x /opt/qr-menu/api/api
            sudo /usr/bin/systemctl restart qr-menu-api
            sudo /usr/bin/systemctl status qr-menu-api --no-pager
          '
